[project]
name = "sync-sdk"
version = "0.1.1"
description = "Embeddable synchronization pipelines with pluggable storage and transports"
readme = "README.md"
authors = [
    { name = "VivekReddy10-08-2004", email = "vivek.bhimavarapu@maine.edu" }
]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11.0"]

[project.urls]
Homepage = "https://github.com/VivekReddy10-08-2004/sync-sdk"
Repository = "https://github.com/VivekReddy10-08-2004/sync-sdk"
Issues = "https://github.com/VivekReddy10-08-2004/sync-sdk/issues"
"Test report" = "https://github.com/VivekReddy10-08-2004/sync-sdk/blob/master/TESTING.md"

[project.optional-dependencies]
http = ["httpx>=0.28.0"]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0.40"]
fastapi = ["fastapi>=0.116.0"]
sqlite = ["sqlalchemy[asyncio]>=2.0.40", "aiosqlite>=0.22.1"]
postgres = ["sqlalchemy[asyncio]>=2.0.40", "asyncpg>=0.30.0"]
mysql = ["sqlalchemy[asyncio]>=2.0.40", "asyncmy>=0.2.10", "cryptography>=44.0.0"]
gateway = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30.0",
    "alembic>=1.16.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.3.5",
    "asyncmy>=0.2.10",
    "cryptography>=44.0.0",
    "aiosqlite>=0.22.1",
]
observability = [
    "opentelemetry-api>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "opentelemetry-exporter-otlp-proto-http>=1.38.0",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "opentelemetry-instrumentation-httpx>=0.59b0",
]
mongodb = [
    "pymongo>=4.11.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.116.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "alembic>=1.16.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.3.5",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "opentelemetry-exporter-otlp-proto-http>=1.38.0",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "opentelemetry-instrumentation-httpx>=0.59b0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "testcontainers[postgres]>=4.12.0",
]

[project.scripts]
sync-sdk = "sync_sdk:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "TESTING.md",
    "docs/**",
    "tests/**",
    "examples/**",
    'Architecture\ Diagram.png',
    ".github/workflows/database-adapters.yml",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
