<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="title description">
  <title id="title">Production backend concurrency comparison</title>
  <desc id="description">PostgreSQL, MySQL, and MongoDB each applied all mutations without failures at concurrency 1, 2, 4, and 8. At concurrency 8, throughput was 368.33, 347.02, and 270.24 mutations per second, with p95 batch latency of 2468.79, 2321.81, and 2961.85 milliseconds.</desc>
  <rect width="900" height="370" rx="14" fill="#ffffff"/>
  <rect x="1" y="1" width="898" height="368" rx="13" fill="none" stroke="#d7dde8" stroke-width="2"/>
  <text x="32" y="38" fill="#172033" font-family="Arial, sans-serif" font-size="20" font-weight="700">Production adapter concurrency test</text>
  <text x="32" y="61" fill="#596579" font-family="Arial, sans-serif" font-size="13">1,000 creates per run · batch size 100 · GitHub Actions · October 15, 2026</text>

  <text x="32" y="98" fill="#172033" font-family="Arial, sans-serif" font-size="15" font-weight="700">Successful throughput</text>
  <text x="32" y="119" fill="#596579" font-family="Arial, sans-serif" font-size="12">mutations/s at concurrency 1 and 8</text>

  <text x="32" y="158" fill="#172033" font-family="Arial, sans-serif" font-size="13">PostgreSQL</text>
  <rect x="113" y="137" width="261" height="14" rx="3" fill="#2563eb"/>
  <rect x="113" y="156" width="239" height="14" rx="3" fill="#93b4f4"/>
  <text x="382" y="149" fill="#172033" font-family="Arial, sans-serif" font-size="11" font-weight="700">402 / 368</text>

  <text x="32" y="217" fill="#172033" font-family="Arial, sans-serif" font-size="13">MySQL</text>
  <rect x="113" y="196" width="226" height="14" rx="3" fill="#2563eb"/>
  <rect x="113" y="215" width="225" height="14" rx="3" fill="#93b4f4"/>
  <text x="347" y="208" fill="#172033" font-family="Arial, sans-serif" font-size="11" font-weight="700">348 / 347</text>

  <text x="32" y="276" fill="#172033" font-family="Arial, sans-serif" font-size="13">MongoDB</text>
  <rect x="113" y="255" width="177" height="14" rx="3" fill="#2563eb"/>
  <rect x="113" y="274" width="175" height="14" rx="3" fill="#93b4f4"/>
  <text x="298" y="267" fill="#172033" font-family="Arial, sans-serif" font-size="11" font-weight="700">274 / 270</text>

  <circle cx="113" cy="309" r="5" fill="#2563eb"/>
  <text x="124" y="313" fill="#596579" font-family="Arial, sans-serif" font-size="12">Concurrency 1</text>
  <circle cx="223" cy="309" r="5" fill="#93b4f4"/>
  <text x="234" y="313" fill="#596579" font-family="Arial, sans-serif" font-size="12">Concurrency 8</text>

  <line x1="449" y1="87" x2="449" y2="318" stroke="#d7dde8"/>
  <text x="480" y="98" fill="#172033" font-family="Arial, sans-serif" font-size="15" font-weight="700">p95 latency at concurrency 8</text>
  <text x="480" y="119" fill="#596579" font-family="Arial, sans-serif" font-size="12">milliseconds per 100-mutation batch</text>

  <text x="480" y="166" fill="#172033" font-family="Arial, sans-serif" font-size="13">PostgreSQL</text>
  <rect x="561" y="151" width="217" height="20" rx="4" fill="#7c3aed"/>
  <text x="786" y="166" fill="#172033" font-family="Arial, sans-serif" font-size="12" font-weight="700">2,469 ms</text>
  <text x="480" y="225" fill="#172033" font-family="Arial, sans-serif" font-size="13">MySQL</text>
  <rect x="561" y="210" width="204" height="20" rx="4" fill="#7c3aed"/>
  <text x="773" y="225" fill="#172033" font-family="Arial, sans-serif" font-size="12" font-weight="700">2,322 ms</text>
  <text x="480" y="284" fill="#172033" font-family="Arial, sans-serif" font-size="13">MongoDB</text>
  <rect x="561" y="269" width="260" height="20" rx="4" fill="#7c3aed"/>
  <text x="829" y="284" fill="#172033" font-family="Arial, sans-serif" font-size="12" font-weight="700">2,962 ms</text>

  <rect x="32" y="329" width="816" height="24" rx="6" fill="#ecfdf3"/>
  <text x="440" y="346" fill="#166534" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">12,000 measured mutations applied · zero failures · all audits passed</text>
</svg>
